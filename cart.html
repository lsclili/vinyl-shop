<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Кошик</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f4f4;">

    <header style="padding: 20px; background: black; color: white; display: flex; justify-content: space-between;">
        <a href="index.html" style="color: white; text-decoration: none;"><h4>Повернутися до покупок</h4></a>
        <h4>Ваш кошик</h4>
    </header>

    <main style="max-width: 800px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div id="cart-container"></div>
        
        <div style="margin-top: 30px; text-align: right; border-top: 2px solid #eee; padding-top: 20px;">
            <h3>Загальна сума: $<span id="total-price">0.00</span></h3>
            <button style="padding: 15px 30px; background: #28a745; color: white; border: none; font-size: 1.1em; cursor: pointer; border-radius: 5px;">
                Оформити замовлення
            </button>
        </div>
    </main>

    <script>
        function renderCart() {
            const container = document.getElementById('cart-container');
            const totalSpan = document.getElementById('total-price');
            let cart = JSON.parse(localStorage.getItem('vinylCart')) || [];
            
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = "<p style='text-align: center; color: #888;'>Ваш кошик порожній.</p>";
                totalSpan.innerText = "0.00";
                return;
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${item.image_url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 5px;">
                            <div>
                                <h3 style="margin: 0 0 5px 0;">${item.title}</h3>
                                <p style="margin: 0; color: #666;">Кількість: ${item.quantity}</p>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <p style="font-size: 1.2em; font-weight: bold; margin: 0 0 10px 0;">$${(item.price * item.quantity).toFixed(2)}</p>
                            <button onclick="removeItem(${index})" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Видалити</button>
                        </div>
                    </div>
                `;
            });

            totalSpan.innerText = total.toFixed(2);
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('vinylCart')) || [];
            cart.splice(index, 1); 
            localStorage.setItem('vinylCart', JSON.stringify(cart));
            renderCart(); 
        }
        renderCart();
    </script>
</body>
</html>
